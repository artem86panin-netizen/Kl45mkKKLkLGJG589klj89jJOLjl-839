<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Тренування Beta</title>
  <link rel="stylesheet" href="styles.css?v=7">
  <link rel="stylesheet" href="styles-v7-addon.css?v=7">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <b>🧪 Тренування Beta</b>
    <span id="sync">Завантаження…</span>
  </header>

  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="exerciseDialog">
    <form id="exerciseForm">
      <h3>Додати вправу</h3>
      <div id="recentExercises"></div>
      <label for="customExercise">Або введи назву</label>
      <input id="customExercise" autocomplete="off" placeholder="Наприклад, жим лежачи">
      <div class="dialog-actions">
        <button type="button" class="secondary-btn" id="cancelExercise">Скасувати</button>
        <button type="submit" class="primary-btn" id="addCustom">Додати</button>
      </div>
    </form>
  </dialog>


  <dialog id="editSetDialog">
    <form id="editSetForm">
      <h3>Редагувати підхід</h3>
      <label for="editSetWeight">Вага, кг</label>
      <input id="editSetWeight" type="number" min="0" step="0.5" required>
      <label for="editSetReps">Повтори</label>
      <input id="editSetReps" type="number" min="0" step="1" required>
      <div class="dialog-actions three">
        <button type="button" class="danger-btn" id="deleteEditedSet">Видалити</button>
        <button type="button" class="secondary-btn" id="cancelEditSet">Скасувати</button>
        <button type="submit" class="primary-btn">Зберегти</button>
      </div>
    </form>
  </dialog>
  <script src="config.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
