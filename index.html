<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Тренування Beta</title>
  <link rel="stylesheet" href="styles.css?v=5">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <b>🧪 Тренування Beta</b>
    <span id="sync">Завантаження…</span>
  </header>

  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="exerciseDialog">
    <form id="exerciseForm">
      <h3>Додати вправу</h3>
      <div id="recentExercises"></div>
      <label for="customExercise">Або введи назву</label>
      <input id="customExercise" autocomplete="off" placeholder="Наприклад, жим лежачи">
      <div class="dialog-actions">
        <button type="button" class="secondary-btn" id="cancelExercise">Скасувати</button>
        <button type="submit" class="primary-btn" id="addCustom">Додати</button>
      </div>
    </form>
  </dialog>

  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
